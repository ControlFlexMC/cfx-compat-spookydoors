plugins {
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = 'cfx-compat-spookydoors'
}

version = "${mod_version}-mc${minecraft_version}-forge"
group = maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

mixin {
    add sourceSets.main, 'cfx_compat_spookydoors.refmap.json'
    config 'cfx-compat-spookydoors.mixins.json'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// The bridge lives in common/ and is loader-agnostic: the door logic, the ControlFlex SPI
// plugin and the MouseHandler accessor mixin are identical on both loaders. Only this
// subproject's entry point, mods.toml and pack.mcmeta are Forge-specific.
sourceSets {
    main {
        java.srcDir(rootProject.file('common/src/main/java'))
        resources.srcDir(rootProject.file('common/src/main/resources'))
    }
    test {
        java.srcDir(rootProject.file('common/src/test/java'))
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // ControlFlex API (plain Java, loader-agnostic), resolved from JitPack.
    compileOnly "com.github.ControlFlexMC:control-flex-api:${controlflex_api_version}"
    compileOnly 'org.jetbrains:annotations:24.0.1'

    annotationProcessor "org.spongepowered:mixin:${mixin_processor_version}:processor"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // The shared tests check the declared action defaults against the bundled compat config; both
    // the API types and the JSON parser have to be on the test classpath for that.
    testImplementation "com.github.ControlFlexMC:control-flex-api:${controlflex_api_version}"
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// DoorSide works on vanilla types (Direction, DoorHingeSide), so the tests need the Minecraft
// artifact on both their compile and their runtime classpath — the mod itself gets it from
// legacyForge's main compile classpath.
tasks.named('compileTestJava', JavaCompile).configure {
    classpath += sourceSets.main.compileClasspath
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    classpath += sourceSets.main.compileClasspath
}

processResources {
    // Only this loader's own metadata is expanded; common/ resources are copied verbatim so
    // both jars carry byte-identical lang files and service descriptor.
    def expandProps = [
        'mod_id'                  : mod_id,
        'mod_name'                : mod_name,
        'mod_version'             : mod_version,
        'mod_authors'             : mod_authors,
        'mod_license'             : mod_license,
        'mod_description'         : mod_description,
        'minecraft_version'       : minecraft_version,
        'minecraft_version_range' : minecraft_version_range,
        'forge_version'           : forge_version,
        'forge_version_range'     : forge_version_range,
        'loader_version_range'    : loader_version_range,
        'java_version'            : java_version,
        'controlflex_mod_id'      : controlflex_mod_id,
        'target_mod_id'           : target_mod_id,
        'controlflex_version_range_forge': controlflex_version_range_forge,
        'target_mod_version_range_forge' : target_mod_version_range_forge,
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

jar {
    manifest {
        attributes([
            'MixinConfigs': 'cfx-compat-spookydoors.mixins.json'
        ])
    }

    from(rootProject.file('LICENSE')) { rename { "${it}_${mod_id}" } }
    finalizedBy 'reobfJar'
}
