org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Gradle 8.8 cannot run on a JDK newer than 22, so the daemon is pinned to a JDK it supports.
# Each subproject pins its own Java 17 compile toolchain independently.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/microsoft-21.jdk/Contents/Home

# Build tools
mixin_processor_version=0.8.5

# Mod (shared by both loader subprojects)
mod_id=cfx_compat_spookydoors
mod_version=0.1.0
mod_name=Control Flex x Spooky Doors
mod_authors=ifels
mod_license=MIT
mod_description=Spooky Doors controller bridge for ControlFlex: push and pull doors with the left stick
maven_group=com.ifels

# Minecraft / loaders
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
java_version=17

# Forge (subproject :forge)
forge_version=47.4.4
forge_version_range=[47,)
loader_version_range=[47,)

# Fabric (subproject :fabric), aligned with ControlFlex dev/1.20.1
fabric_loader_version=0.15.11
fabric_api_version=0.92.2+1.20.1

# Runtime dependency mod ids (provided at runtime)
controlflex_mod_id=controlflex
target_mod_id=spookydoors

# Runtime dependency version ranges: same floors on both loaders, written twice because
# Forge reads Maven ranges and Fabric reads SemVer predicates.
# ControlFlex floor is 0.9.0 although the bridge needs AnalogValues (0.9.3.0) — the plugin
# checks the API version at runtime and disables door drag, so an older ControlFlex still
# starts; refusing to load against it would only turn a degraded bridge into a crash.
controlflex_version_range=>=0.9.0
controlflex_version_range_forge=[0.9.0,)
# Spooky Doors stays optional (Forge: mandatory=false, Fabric: "recommends"): without it the
# three actions simply never target a door.
target_mod_version_range=>=1.20
target_mod_version_range_forge=[1.20,)

# ControlFlex API (plain Java, loader-agnostic), resolved from JitPack:
#   com.github.ControlFlexMC:control-flex-api:<version>
controlflex_api_version=0.9.3.0
