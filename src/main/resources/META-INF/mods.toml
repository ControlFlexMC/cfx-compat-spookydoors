modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
side="CLIENT"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="${controlflex_mod_id}"
mandatory=true
versionRange="[0.9.0,)"
ordering="AFTER"
side="CLIENT"

# Optional on purpose: without Spooky Doors the four actions simply never target anything,
# so a modpack that drops the door mod does not fail to start.
[[dependencies.${mod_id}]]
modId="${target_mod_id}"
mandatory=false
versionRange="${target_mod_version_range}"
ordering="AFTER"
side="CLIENT"
